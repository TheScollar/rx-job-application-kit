name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor (the scripts' stated target) through a current release.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile scripts and tests
        run: python -m compileall -q scripts tests
      - name: Run unit tests (standard library only)
        run: python -m unittest discover -s tests -t tests -p "test_*.py"
